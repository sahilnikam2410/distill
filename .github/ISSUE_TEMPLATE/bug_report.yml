name: Bug report
description: distill dropped a fact, broke a rule, or misbehaved
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Claude Code (plugin), Claude Code (manual install), claude.ai / desktop, token_meter.py]
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options: [auto, lite, pro, max, wenyan-lite, wenyan, wenyan-max, n/a]
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: What you asked.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What Claude replied
      description: Paste the reply. Redact anything private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was wrong
      description: The rule it broke, or the fact, number or warning it dropped.
    validations:
      required: true
