name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches plugin version
        run: |
          version=$(python -c "import json; print(json.load(open('plugins/distill/.claude-plugin/plugin.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plugin version $version"; exit 1; }
      - run: python scripts/build_skill.py --check
      # A release drafted on github.com creates its own tag, which also starts
      # this workflow; in that case only attach the bundle.
      - name: Publish release with distill.skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" distill.skill --clobber
          else
            gh release create "$GITHUB_REF_NAME" distill.skill --title "$GITHUB_REF_NAME" --generate-notes
          fi
