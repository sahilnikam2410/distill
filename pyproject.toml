# Tooling config only; this repo is not a Python package.
[tool.ruff]
target-version = "py39"
line-length = 100
# Fixtures hold planted bugs; results are saved model replies and must stay verbatim.
extend-exclude = ["benchmark/tasks/fixtures", "benchmark/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
